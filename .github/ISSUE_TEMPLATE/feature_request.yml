name: Idea
description: Suggest something miruyo could do
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The problem or the moment it would help with, before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - Website
        - App
