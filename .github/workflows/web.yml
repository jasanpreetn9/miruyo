name: Web

# The SvelteKit app in apps/web. Starts on every push and pull request, so
# the required checks always report, and skips its steps unless apps/web (or
# this workflow) changed. A path filter here would leave a mobile-only PR
# waiting on checks that never run.
on:
  push:
    branches: [main]
  pull_request:

# The build needs a client id; tests never reach AniList's sign-in.
env:
  PUBLIC_ANILIST_CLIENT_ID: '20987'
  # what counts as a web change (see .github/scripts/changed.sh)
  WEB_FILES: '^(apps/web/|\.github/(workflows/web\.yml|scripts/changed\.sh)$)'

# checks only read the code
permissions:
  contents: read

defaults:
  run:
    working-directory: apps/web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: changes
        run: bash "$GITHUB_WORKSPACE/.github/scripts/changed.sh" "$WEB_FILES"
        env:
          BEFORE: ${{ github.event.before }}
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        if: steps.changes.outputs.changed == 'true'
      - run: npm run lint
        if: steps.changes.outputs.changed == 'true'
      - run: npm run check
        if: steps.changes.outputs.changed == 'true'
      - run: npm run test:unit
        if: steps.changes.outputs.changed == 'true'

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: changes
        run: bash "$GITHUB_WORKSPACE/.github/scripts/changed.sh" "$WEB_FILES"
        env:
          BEFORE: ${{ github.event.before }}
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        if: steps.changes.outputs.changed == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.changes.outputs.changed == 'true'
      - run: npm run test:e2e
        if: steps.changes.outputs.changed == 'true'
      # then the production build, as Vercel makes it (its adapter needs Node
      # 22 or 24), served by SvelteKit's preview: code that only runs in
      # production (analytics) is checked here, which the dev server above
      # never runs
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: 24
      - run: npm run build
        if: steps.changes.outputs.changed == 'true'
      - run: npm run test:prod
        if: steps.changes.outputs.changed == 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
