name: Web

# Lint, type check, unit tests, e2e and a production smoke test, on every
# push to main and every pull request.
on:
  push:
    branches: [main]
  pull_request:

# The build needs a client id; tests never reach AniList's sign-in.
env:
  PUBLIC_ANILIST_CLIENT_ID: '20987'

# checks only read the code
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test:unit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # then the production build, as Vercel makes it (its adapter needs Node
      # 22 or 24), served by SvelteKit's preview: code that only runs in
      # production (analytics) is checked here, which the dev server above
      # never runs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run build
      - run: npm run test:prod
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
