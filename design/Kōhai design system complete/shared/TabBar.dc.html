<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block">
<style>body{margin:0;background:#090B11;color:#EEF0F6;font-family:'Geist',system-ui,sans-serif}</style>
</helmet>
<div style="width:100%;box-sizing:border-box;padding:6px 8px 26px;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(12,14,21,.92);backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.07)">
  <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
    <div style="height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:{{ t.c }}">
      <div style="width:56px;height:30px;border-radius:999px;display:grid;place-items:center;background:{{ t.bg }}"><span class="material-symbols-rounded" style="font-size:24px;font-variation-settings:{{ t.fill }}">{{ t.i }}</span></div>
      <div style="font-size:11px;font-weight:{{ t.w }}">{{ t.n }}</div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:84},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;browse&quot;,&quot;seasonal&quot;,&quot;list&quot;,&quot;profile&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;anime&quot;,&quot;manga&quot;],&quot;default&quot;:&quot;anime&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals(){
    // 'search' was this slot's old name; Search now lives in Browse (and ⌘K)
    const a=this.props.active==='search'?'seasonal':(this.props.active||'home'); const isA=(this.props.mode||'anime')==='anime';
    const acc=isA?'#FF8A78':'#B9A9FF', tint=isA?'rgba(255,106,85,.16)':'rgba(160,140,255,.18)';
    const tabs=[['home','Home','home'],['browse','Browse','explore'],['seasonal',isA?'Seasonal':'Releases',isA?'calendar_month':'new_releases'],['list','My List','bookmarks'],['profile','Profile','person']].map(([k,n,i])=>({n,i,c:k===a?acc:'#A6ADC2',bg:k===a?tint:'transparent',w:k===a?600:500,fill:k===a?"'FILL' 1":"'FILL' 0"}));
    return {tabs};
  }
}
</script>
</body>
</html>
