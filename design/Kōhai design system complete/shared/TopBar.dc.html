<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block">
<style>body{margin:0;background:#090B11;color:#EEF0F6;font-family:'Geist',system-ui,sans-serif}</style>
</helmet>
<sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
<div style="height:64px;padding:0 32px;display:flex;align-items:center;gap:28px;background:rgba(9,11,17,.78);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.06);width:100%;box-sizing:border-box">
  <div style="display:flex;align-items:center;gap:10px">
    <div style="width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:800 17px/1 'Bricolage Grotesque';background:{{ acc }};color:{{ ink }}">見</div>
    <div style="font:700 20px/1 'Bricolage Grotesque';letter-spacing:-.02em;color:#EEF0F6">miruyo</div>
  </div>
  <div style="display:inline-flex;padding:3px;gap:2px;border-radius:999px;background:#10131C;border:1px solid rgba(255,255,255,.08)">
    <button onClick="{{ toAnime }}" style="height:32px;padding:0 14px 0 10px;border:0;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font:600 13px 'Geist';cursor:pointer;transition:all .18s;background:{{ aBg }};color:{{ aFg }}"><span class="material-symbols-rounded" style="font-size:18px">play_circle</span>Anime</button>
    <button onClick="{{ toManga }}" style="height:32px;padding:0 14px 0 10px;border:0;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font:600 13px 'Geist';cursor:pointer;transition:all .18s;background:{{ mBg }};color:{{ mFg }}"><span class="material-symbols-rounded" style="font-size:18px">menu_book</span>Manga</button>
  </div>
  <nav style="display:flex;gap:4px">
    <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
      <div style="height:36px;padding:0 12px;border-radius:8px;display:flex;align-items:center;font-size:14px;cursor:pointer;font-weight:{{ l.w }};color:{{ l.c }};box-shadow:{{ l.sh }}" style-hover="color:#EEF0F6;background:rgba(255,255,255,.05)">{{ l.n }}</div>
    </sc-for>
  </nav>
  <div style="flex:1"></div>
  <div style="height:40px;border-radius:10px;background:#10131C;border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:8px;padding:0 12px;color:#7C849C;font-size:14px;font-weight:500;white-space:nowrap"><span class="material-symbols-rounded" style="font-size:20px">search</span>Search<span style="font:500 11px 'Geist Mono';padding:2px 6px;border-radius:5px;border:1px solid rgba(255,255,255,.08)">⌘K</span></div>
  <sc-if value="{{ loggedIn }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;align-items:center;gap:8px;position:relative">
      <button onClick="{{ toggleBell }}" style="width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:{{ bellFg }};display:grid;place-items:center;position:relative;cursor:pointer"><span class="material-symbols-rounded" style="font-size:22px">notifications</span><sc-if value="{{ hasUnread }}" hint-placeholder-val="{{ true }}"><span style="position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:{{ acc }};box-shadow:0 0 0 2px #090B11"></span></sc-if></button>
      <button onClick="{{ toggleAccount }}" style="display:flex;align-items:center;gap:6px;padding:3px 6px 3px 3px;border-radius:999px;border:1px solid rgba(255,255,255,.08);background:transparent;cursor:pointer"><div style="width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 12px 'Geist';color:#fff;background:linear-gradient(135deg,#5AB0FF,#A08CFF)">HA</div><span class="material-symbols-rounded" style="font-size:18px;color:#A6ADC2;transform:{{ caret }}">expand_more</span></button>
      <sc-if value="{{ bellOpen }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;top:48px;right:52px;width:384px;z-index:50;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:#090B11;box-shadow:0 24px 48px rgba(0,0,0,.5);overflow:hidden">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.05)"><div style="font-size:14px;font-weight:600">Notifications</div><div style="display:flex;align-items:center;gap:4px;font-size:12px;font-weight:500;color:#A6ADC2">All on AniList<span class="material-symbols-rounded" style="font-size:14px">open_in_new</span></div></div>
          <div style="padding:6px">
            <sc-for list="{{ notes }}" as="n" hint-placeholder-count="4">
              <div style="display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:8px;min-height:44px" style-hover="background:rgba(255,255,255,.05)">
                <div style="flex:none;width:{{ n.w }};height:{{ n.h }};border-radius:{{ n.r }};background:{{ n.img }};display:grid;place-items:center;font:600 14px 'Geist';color:#A6ADC2">{{ n.initial }}</div>
                <div style="flex:1;min-width:0"><div style="font-size:13px;line-height:1.35;color:#A6ADC2">{{ n.pre }}<b style="color:#EEF0F6;font-weight:600">{{ n.strong }}</b>{{ n.post }}</div><div style="margin-top:2px;font-size:12px;color:#7C849C">{{ n.when }}</div></div>
                <sc-if value="{{ n.unread }}" hint-placeholder-val="{{ false }}"><span style="flex:none;width:8px;height:8px;border-radius:50%;background:{{ acc }}"></span></sc-if>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{ accountOpen }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;top:48px;right:0;width:208px;z-index:50;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(16,19,28,.96);backdrop-filter:blur(12px);box-shadow:0 24px 48px rgba(0,0,0,.5);padding:6px">
          <div style="padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.05)"><div style="font-size:11px;font-weight:500;color:#A6ADC2">Signed in as</div><div style="font-size:14px;font-weight:600">haruka_k</div></div>
          <div style="padding:4px 0">
            <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-size:13px" style-hover="background:rgba(255,255,255,.05)"><span class="material-symbols-rounded" style="font-size:18px;color:#A6ADC2">open_in_new</span>AniList Profile</div>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-size:13px" style-hover="background:rgba(255,255,255,.05)"><span class="material-symbols-rounded" style="font-size:18px;color:#A6ADC2">settings</span>Settings</div>
          </div>
          <div style="border-top:1px solid rgba(255,255,255,.05);padding-top:4px"><div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-size:13px;color:#FF8FA8" style-hover="background:rgba(244,63,94,.1)"><span class="material-symbols-rounded" style="font-size:18px">logout</span>Log Out</div></div>
        </div>
      </sc-if>
    </div>
  </sc-if>
  <sc-if value="{{ loggedOut }}" hint-placeholder-val="{{ false }}">
    <button style="height:40px;padding:0 16px;border:0;border-radius:10px;font:600 14px 'Geist';display:flex;align-items:center;gap:8px;background:{{ acc }};color:{{ ink }}">Log in with AniList</button>
  </sc-if>
</div>
</sc-if>
<sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
<div style="height:56px;padding:0 16px;display:flex;align-items:center;gap:10px;background:rgba(9,11,17,.82);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.06);width:100%;box-sizing:border-box">
  <div style="width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:800 16px/1 'Bricolage Grotesque';background:{{ acc }};color:{{ ink }}">見</div>
  <div style="flex:1;font:700 18px/1 'Bricolage Grotesque';letter-spacing:-.02em;color:#EEF0F6">miruyo</div>
  <div style="display:inline-flex;padding:3px;gap:2px;border-radius:999px;background:#10131C;border:1px solid rgba(255,255,255,.08)">
    <button onClick="{{ toAnime }}" style="height:32px;padding:0 10px;border:0;border-radius:999px;display:inline-flex;align-items:center;gap:4px;font:600 12px 'Geist';cursor:pointer;background:{{ aBg }};color:{{ aFg }}"><span class="material-symbols-rounded" style="font-size:16px">play_circle</span>{{ aLbl }}</button>
    <button onClick="{{ toManga }}" style="height:32px;padding:0 10px;border:0;border-radius:999px;display:inline-flex;align-items:center;gap:4px;font:600 12px 'Geist';cursor:pointer;background:{{ mBg }};color:{{ mFg }}"><span class="material-symbols-rounded" style="font-size:16px">menu_book</span>{{ mLbl }}</button>
  </div>
  <sc-if value="{{ loggedIn }}" hint-placeholder-val="{{ true }}">
    <button style="width:32px;height:32px;border-radius:10px;border:0;background:transparent;color:#A6ADC2;display:grid;place-items:center;position:relative"><span class="material-symbols-rounded" style="font-size:20px">notifications</span><sc-if value="{{ hasUnread }}" hint-placeholder-val="{{ true }}"><span style="position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:{{ acc }};box-shadow:0 0 0 2px #090B11"></span></sc-if></button>
    <div style="width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.08);background:linear-gradient(135deg,#5AB0FF,#A08CFF)"></div>
  </sc-if>
  <sc-if value="{{ loggedOut }}" hint-placeholder-val="{{ false }}">
    <button style="height:32px;padding:0 10px;border:0;border-radius:8px;font:600 12px 'Geist';background:{{ acc }};color:{{ ink }}">Log In</button>
  </sc-if>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:64},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;anime&quot;,&quot;manga&quot;],&quot;default&quot;:&quot;anime&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;browse&quot;,&quot;seasonal&quot;,&quot;list&quot;,&quot;profile&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;auth&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;in&quot;,&quot;out&quot;],&quot;default&quot;:&quot;in&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;open&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;notifications&quot;,&quot;account&quot;],&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;unread&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;miruyo&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onMode&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(m:string)=&gt;void&quot;}}">
class Component extends DCLogic {
  menus(isA){
    const open = this.state.open ?? (this.props.open || 'none');
    const unread = this.props.unread !== false && open !== 'notifications';
    const toggle = k => ()=> this.setState({open: open===k ? 'none' : k});
    const cover = c => ({w:'34px',h:'48px',r:'6px',img:c,initial:''});
    const person = n => ({w:'36px',h:'36px',r:'50%',img:'#161A26',initial:n[0].toUpperCase()});
    const notes = [
      {...cover('linear-gradient(160deg,#7FC8A9,#2F7D62)'),pre:'Episode 5 of ',strong:'Frieren: Beyond Journey’s End',post:' aired.',when:'2h ago',unread:true},
      {...person('rin'),pre:'',strong:'rin',post:' replied to your activity.',when:'8h ago',unread:true},
      {...person('kaito_s'),pre:'',strong:'kaito_s',post:' started following you.',when:'3d ago',unread:false},
      {...cover('linear-gradient(160deg,#F2B880,#B5523B)'),pre:'',strong:'Dandadan',post:' was recently added to the site.',when:'Sep 18',unread:false},
    ];
    return {
      bellOpen: open==='notifications', accountOpen: open==='account',
      toggleBell: toggle('notifications'), toggleAccount: toggle('account'),
      hasUnread: unread, bellFg: open==='notifications'?'#EEF0F6':'#A6ADC2',
      caret: open==='account'?'rotate(180deg)':'none', notes,
    };
  }
  state = { mode:null, open:null };
  renderVals(){
    const pr=this.props;
    const mode = this.state.mode || pr.mode || 'anime';
    const isA = mode==='anime';
    const active = pr.active || 'home';
    const links = [['home','Home'],['browse','Browse'],['seasonal',isA?'Seasonal':'New releases'],['list','My List'],['profile','Profile']].map(([k,n])=>({n,w:k===active?600:500,c:k===active?'#EEF0F6':'#A6ADC2',sh:k===active?`inset 0 -2px 0 ${isA?'#FF6A55':'#A08CFF'}`:'none'}));
    const set = m => ()=>{ this.setState({mode:m}); pr.onMode && pr.onMode(m); };
    const loggedOut = pr.auth==='out';
    return {
      desktop: pr.device!=='mobile', mobile: pr.device==='mobile',
      acc: isA?'#FF6A55':'#A08CFF', ink: isA?'#1A0B08':'#140E2B',
      aBg: isA?'#FF6A55':'transparent', aFg: isA?'#1A0B08':'#A6ADC2',
      mBg: !isA?'#A08CFF':'transparent', mFg: !isA?'#140E2B':'#A6ADC2',
      aLbl: isA?'Anime':'', mLbl: !isA?'Manga':'',
      toAnime:set('anime'), toManga:set('manga'),
      links, loggedIn: !loggedOut, loggedOut,
      ...this.menus(isA),
    };
  }
}
</script>
</body>
</html>
